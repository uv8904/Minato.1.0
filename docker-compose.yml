services:
  worker:
    build: .
    restart: unless-stopped
    # All configuration comes from .env (copy .env.example and fill it in).
    # Nothing is hardcoded in the image; missing required vars stop the bot.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
EOF